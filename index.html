<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeCard Online - Treinador & Trocas</title>
    <style>
        :root {
            --bg: #0b0e14;
            --card-bg: #1e293b;
            --accent: #ffcb05;
            --blue: #3b4cca;
            --red: #ef4444;
            --green: #22c55e;
            --purple: #9333ea;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
        }

        /* --- TELA DE LOGIN/CADASTRO --- */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #3b4cca 0%, #0b0e14 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .auth-container {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .auth-container h2 { color: var(--blue); margin-top: 0; }
        .auth-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .auth-container button {
            width: 100%;
            padding: 12px;
            background: var(--red);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
        }

        .auth-container p { font-size: 13px; margin-top: 15px; cursor: pointer; color: var(--blue); text-decoration: underline; }

        /* --- SITE PRINCIPAL --- */
        #main-app { display: none; }

        nav {
            background: #1e293b;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            position: sticky;
            top: 0; z-index: 100;
            border-bottom: 3px solid var(--accent);
        }

        nav button {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        nav button.active { background: var(--accent); color: #000; }
        .logout-btn { background: var(--red) !important; color: white !important; border: none !important; }

        .container { padding: 20px; max-width: 1200px; margin: auto; display: none; }
        .container.active { display: block; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .pokemon-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            transition: 0.3s;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .pokemon-card img { width: 100%; border-radius: 5px; }
        .not-owned { opacity: 0.2; filter: grayscale(1); }
        .owned-badge {
            position: absolute; top: 5px; right: 5px;
            background: var(--green); color: white;
            font-size: 10px; padding: 2px 6px; border-radius: 10px;
            display: none;
        }
        .is-owned .owned-badge { display: block; }
        .is-owned { border-color: var(--green); opacity: 1; filter: none; }

        /* --- TROCAS --- */
        .trade-ui { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 20px; }
        .trade-form { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 30px; }
        .trade-input-group { background: #2d3748; padding: 10px; border-radius: 10px; }
        .trade-input-group input { background: transparent; border: 1px solid #4a5568; color: white; padding: 5px; border-radius: 5px; }
        
        .notification-badge { background: var(--red); color: white; padding: 2px 8px; border-radius: 50%; font-size: 12px; margin-left: 5px; }
        
        .pending-trade-card { 
            background: var(--card-bg); border-left: 5px solid var(--purple); 
            padding: 15px; margin-bottom: 10px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .gacha-box { text-align: center; padding: 40px; background: rgba(255,255,255,0.05); border-radius: 20px; }
        #btn-draw {
            background: var(--red); color: white; font-size: 20px;
            padding: 15px 30px; border: none; border-radius: 50px; cursor: pointer;
        }
        #btn-draw:disabled { background: #555; cursor: not-allowed; }

        #modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 2000;
            justify-content: center; align-items: center; cursor: zoom-out;
        }
        #modal img { max-height: 85vh; border-radius: 15px; }

        .user-info { color: var(--accent); font-weight: bold; margin-right: 10px; border-right: 1px solid #555; padding-right: 15px; display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-container" id="login-box">
            <h2>PokeCard Login</h2>
            <input type="text" id="user-login" placeholder="Nome de Usuário">
            <input type="password" id="pass-login" placeholder="Sua Senha">
            <button onclick="handleLogin()">ENTRAR NO JOGO</button>
            <p onclick="toggleAuth()">Não tem conta? Criar Cadastro</p>
        </div>

        <div class="auth-container" id="register-box" style="display:none;">
            <h2>Novo Treinador</h2>
            <input type="text" id="user-reg" placeholder="Escolha um Usuário">
            <input type="password" id="pass-reg" placeholder="Crie uma Senha">
            <button onclick="handleRegister()">FINALIZAR CADASTRO</button>
            <p onclick="toggleAuth()">Já tem conta? Fazer Login</p>
        </div>
    </div>

    <div id="main-app">
        <nav>
            <div class="user-info">
                <span id="display-username"></span>
                <small id="display-id" style="color: #888;"></small>
            </div>
            <button onclick="showTab('tab-gacha')" id="nav-gacha" class="active">Loja</button>
            <button onclick="showTab('tab-colecao')" id="nav-colecao">Minha Coleção</button>
            <button onclick="showTab('tab-pokedex')" id="nav-pokedex">Pokédex</button>
            <button onclick="showTab('tab-trade')" id="nav-trade">Trocas <span id="trade-count" class="notification-badge" style="display:none">0</span></button>
            <button class="logout-btn" onclick="logout()">Sair</button>
        </nav>

        <div id="tab-gacha" class="container active">
            <div class="gacha-box">
                <h1>Ganhe 10 Cartas Aleatórias!</h1>
                <p>Disponível a cada 1 hora para todos os treinadores.</p>
                <button id="btn-draw" onclick="drawCards()">ABRIR PACOTE (GRÁTIS)</button>
                <p id="timer" style="color: var(--accent); margin-top: 10px; font-weight: bold;"></p>
                <div id="draw-results" class="grid" style="margin-top: 30px;"></div>
            </div>
        </div>

        <div id="tab-colecao" class="container">
            <h1>Minha Coleção (<span id="count-owned">0</span>/151)</h1>
            <div id="collection-grid" class="grid"></div>
        </div>

        <div id="tab-pokedex" class="container">
            <h1>Pokédex de Kanto</h1>
            <div id="pokedex-grid" class="grid"></div>
        </div>

        <div id="tab-trade" class="container">
            <h1>Centro de Trocas</h1>
            <div class="trade-ui">
                <div class="trade-form">
                    <div class="trade-input-group">
                        <label>ID do Amigo:</label><br>
                        <input type="text" id="trade-target-id" placeholder="ID-XXXXX">
                    </div>
                    <div class="trade-input-group">
                        <label>Eu dou (Nº):</label><br>
                        <input type="number" id="trade-my-poke" min="1" max="151">
                    </div>
                    <div class="trade-input-group">
                        <label>Eu quero (Nº):</label><br>
                        <input type="number" id="trade-target-poke" min="1" max="151">
                    </div>
                    <button onclick="sendTradeRequest()" style="background: var(--green); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; align-self: flex-end;">Propor Troca</button>
                </div>
                <hr style="border-color: #333;">
                <h3>Propostas Recebidas</h3>
                <div id="pending-trades-list"></div>
            </div>
        </div>
    </div>

    <div id="modal" onclick="this.style.display='none'"><img id="modal-img" src=""></div>

    <script>
        let currentUser = null;

        function toggleAuth() {
            document.getElementById('login-box').style.display = 
                document.getElementById('login-box').style.display === 'none' ? 'block' : 'none';
            document.getElementById('register-box').style.display = 
                document.getElementById('register-box').style.display === 'none' ? 'block' : 'none';
        }

        function handleRegister() {
            const u = document.getElementById('user-reg').value.trim();
            const p = document.getElementById('pass-reg').value.trim();
            
            if(u.length < 3 || p.length < 3) {
                return alert("Usuário e senha devem ter pelo menos 3 caracteres!");
            }
            
            if(localStorage.getItem(`user_${u}`)) {
                return alert("Esse nome de treinador já está em uso!");
            }

            const randomID = "ID-" + Math.floor(10000 + Math.random() * 90000);
            const userData = { 
                username: u, 
                password: p, 
                id: randomID,
                collection: [], 
                lastClaim: 0,
                trades: []
            };
            
            localStorage.setItem(`user_${u}`, JSON.stringify(userData));
            localStorage.setItem(`id_map_${randomID}`, u); 
            alert("Cadastro realizado! Seu ID é: " + randomID);
            toggleAuth();
        }

        function handleLogin() {
            const u = document.getElementById('user-login').value.trim();
            const p = document.getElementById('pass-login').value.trim();
            const rawData = localStorage.getItem(`user_${u}`);

            if(!rawData) return alert("Treinador não encontrado!");

            const user = JSON.parse(rawData);
            if(user.password === p) {
                currentUser = user;
                startApp();
            } else {
                alert("Senha incorreta!");
            }
        }

        function startApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('display-username').innerText = `Treinador: ${currentUser.username}`;
            document.getElementById('display-id').innerText = `ID: ${currentUser.id}`;
            updateTimer();
            initPokedex();
            updateTradeNotifications();
        }

        function logout() { location.reload(); }

        function save(user = currentUser) {
            if(user) {
                localStorage.setItem(`user_${user.username}`, JSON.stringify(user));
            }
        }

        function showTab(id) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            const btnId = `nav-${id.split('-')[1]}`;
            if(document.getElementById(btnId)) document.getElementById(btnId).classList.add('active');
            
            if(id === 'tab-colecao') renderCollection();
            if(id === 'tab-pokedex') initPokedex();
            if(id === 'tab-trade') renderPendingTrades();
        }

        function drawCards() {
            const now = Date.now();
            if(now - currentUser.lastClaim < 3600000) return;

            currentUser.lastClaim = now;
            const results = document.getElementById('draw-results');
            results.innerHTML = '';

            for(let i=0; i<10; i++) {
                const randomId = Math.floor(Math.random() * 151) + 1;
                currentUser.collection.push(randomId);
                const img = document.createElement('img');
                img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${randomId}.png`;
                img.style.width = "100px";
                results.appendChild(img);
            }
            save();
            updateTimer();
        }

        function updateTimer() {
            if(!currentUser) return;
            const btn = document.getElementById('btn-draw');
            const timer = document.getElementById('timer');
            const diff = Date.now() - currentUser.lastClaim;

            if(diff < 3600000) {
                btn.disabled = true;
                const rem = 3600000 - diff;
                const m = Math.floor(rem / 60000);
                const s = Math.floor((rem % 60000) / 1000);
                timer.innerText = `Próximo pacote em: ${m}m ${s}s`;
                setTimeout(updateTimer, 1000);
            } else {
                btn.disabled = false;
                timer.innerText = "Pacote pronto!";
            }
        }

        // --- LÓGICA DE TROCAS ---
        function sendTradeRequest() {
            const targetID = document.getElementById('trade-target-id').value.trim();
            const myPoke = parseInt(document.getElementById('trade-my-poke').value);
            const targetPoke = parseInt(document.getElementById('trade-target-poke').value);

            if(!currentUser.collection.includes(myPoke)) return alert("Você não tem esse Pokémon!");
            
            const targetUsername = localStorage.getItem(`id_map_${targetID}`);
            if(!targetUsername) return alert("ID não encontrado!");
            if(targetUsername === currentUser.username) return alert("Você não pode trocar consigo mesmo!");

            const targetUser = JSON.parse(localStorage.getItem(`user_${targetUsername}`));
            
            const request = {
                fromUser: currentUser.username,
                give: myPoke,
                want: targetPoke,
                id: Date.now()
            };

            if(!targetUser.trades) targetUser.trades = [];
            targetUser.trades.push(request);
            save(targetUser);
            alert("Proposta enviada!");
        }

        function renderPendingTrades() {
            const list = document.getElementById('pending-trades-list');
            list.innerHTML = currentUser.trades.length === 0 ? '<p style="color:#888">Nenhuma proposta recebida.</p>' : '';
            
            currentUser.trades.forEach((t, index) => {
                const div = document.createElement('div');
                div.className = 'pending-trade-card';
                div.innerHTML = `
                    <div>
                        <strong>${t.fromUser}</strong> quer seu Pokémon <strong>#${t.want}</strong><br>
                        <small>Ele oferece o Pokémon <strong>#${t.give}</strong></small>
                    </div>
                    <div>
                        <button onclick="acceptTrade(${index})" style="background:var(--green); color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; margin-right:5px;">Aceitar</button>
                        <button onclick="declineTrade(${index})" style="background:var(--red); color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer;">Recusar</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function acceptTrade(index) {
            const t = currentUser.trades[index];
            const otherUser = JSON.parse(localStorage.getItem(`user_${t.fromUser}`));

            if(!currentUser.collection.includes(t.want)) return alert("Você não tem mais esse Pokémon!");
            if(!otherUser.collection.includes(t.give)) return alert("O outro treinador não tem mais o Pokémon oferecido!");

            // Realiza a troca
            currentUser.collection.splice(currentUser.collection.indexOf(t.want), 1);
            currentUser.collection.push(t.give);
            otherUser.collection.splice(otherUser.collection.indexOf(t.give), 1);
            otherUser.collection.push(t.want);

            currentUser.trades.splice(index, 1);
            save(currentUser);
            save(otherUser);
            alert("Troca efetuada!");
            renderPendingTrades();
            updateTradeNotifications();
        }

        function declineTrade(index) {
            currentUser.trades.splice(index, 1);
            save();
            renderPendingTrades();
            updateTradeNotifications();
        }

        function updateTradeNotifications() {
            const badge = document.getElementById('trade-count');
            const count = currentUser.trades ? currentUser.trades.length : 0;
            if(count > 0) {
                badge.style.display = 'inline';
                badge.innerText = count;
            } else {
                badge.style.display = 'none';
            }
        }

        // --- POKEDEX E COLEÇÃO ---
        function initPokedex() {
            const grid = document.getElementById('pokedex-grid');
            grid.innerHTML = '';
            for(let i=1; i<=151; i++) {
                const isOwned = currentUser.collection.includes(i);
                const div = document.createElement('div');
                div.className = `pokemon-card ${isOwned ? 'is-owned' : 'not-owned'}`;
                div.innerHTML = `
                    <div class="owned-badge">Obtida</div>
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${i}.png">
                    <p>#${i}</p>
                `;
                grid.appendChild(div);
            }
        }

        function renderCollection() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = '';
            const uniqueIds = [...new Set(currentUser.collection)].sort((a,b) => a-b);
            document.getElementById('count-owned').innerText = uniqueIds.length;

            uniqueIds.forEach(id => {
                const div = document.createElement('div');
                div.className = 'pokemon-card is-owned';
                div.onclick = () => showCardZoom(id);
                div.innerHTML = `<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png"><p>#${id}</p>`;
                grid.appendChild(div);
            });
        }

        function showCardZoom(id) {
            const modal = document.getElementById('modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3bmZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/3o7bu3XilJ5BOiSGic/giphy.gif"; 
            modal.style.display = 'flex';
            fetch(`https://api.pokemontcg.io/v2/cards?q=nationalPokedexNumbers:${id}&pageSize=1`)
                .then(r => r.json()).then(d => {
                    if(d.data.length > 0) modalImg.src = d.data[0].images.large;
                });
        }
    </script>
</body>
</html>
